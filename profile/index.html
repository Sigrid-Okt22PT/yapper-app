<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Yapper</title>
    <meta name="description"
        content="Yapper - A playful social media frontend built with Tailwind CSS. Create posts, like posts, view user profiles, and enjoy a minimal responsive design." />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="bg-gray-800 min-h-screen" data-page="profile">
    <header class="bg-gray-900 shadow-md px-4 py-3 flex items-center justify-between md:px-8">
        <a href="../" class="text-xl font-bold text-yellow-400">Yapper</a>

        <nav class="hidden md:flex space-x-6 text-sm items-center">
            <a href="../feed/" class="text-yellow-300 hover:text-gray-300 font-medium">Feed</a>
            <a href="./" class="text-yellow-300 hover:text-gray-300 font-medium">Profile</a>
            <a href="#" data-logout class="text-yellow-300 hover:text-red-500 font-medium">Logout</a>
        </nav>

        <details class="md:hidden relative">
            <summary class="cursor-pointer p-2 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400 list-none">
                <svg class="w-6 h-6 text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </summary>
            <div class="absolute right-0 mt-2 w-40 bg-gray-900 border rounded shadow-md py-2 z-10">
                <a href="../feed/" class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm">Feed</a>
                <a href="./" class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm">Profile</a>
                <a href="#" data-logout class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm text-red-500">Logout</a>
            </div>
        </details>
    </header>

    <main class="p-4 mt-4 max-w-2xl mx-auto space-y-6">
        <section class="bg-gray-900 p-6 rounded shadow flex flex-col sm:flex-row sm:items-center sm:space-x-4 gap-4">
            <img data-profile-avatar src="https://placehold.co/160x160?text=Avatar" alt="Profile avatar"
                class="w-24 h-24 sm:w-32 sm:h-32 rounded-full object-cover" />
            <div class="space-y-2">
                <h2 data-profile-name class="text-2xl font-bold text-gray-100">Loading profile…</h2>
                <p data-profile-email class="text-gray-400 text-sm"></p>
                <p data-profile-bio class="text-gray-300 text-sm">Fetching profile details…</p>
                <button data-follow-toggle
                    class="mt-3 bg-yellow-400 px-4 py-1 rounded hover:bg-yellow-500 hidden">Follow</button>
            </div>
        </section>

        <section class="bg-gray-900 p-4 rounded shadow flex justify-around text-center">
            <div>
                <p data-profile-followers class="text-xl font-bold text-gray-100">0</p>
                <p class="text-sm text-gray-200">Followers</p>
            </div>
            <div>
                <p data-profile-following class="text-xl font-bold text-gray-100">0</p>
                <p class="text-sm text-gray-200">Following</p>
            </div>
        </section>

        <section data-profile-actions class="bg-gray-900 p-4 rounded shadow space-y-4 hidden">
            <h3 class="text-lg font-semibold text-gray-100">Profile settings</h3>
            <form data-profile-media class="space-y-3">
                <p class="text-sm" data-profile-actions-feedback aria-live="polite"></p>
                <div>
                    <label class="block text-sm text-gray-300" for="avatarUrl">Avatar URL</label>
                    <input id="avatarUrl" name="avatarUrl" type="url" placeholder="https://…"
                        class="bg-gray-800 text-white w-full p-2 rounded focus:outline-none" />
                </div>
                <div>
                    <label class="block text-sm text-gray-300" for="avatarAlt">Avatar description</label>
                    <input id="avatarAlt" name="avatarAlt" type="text" placeholder="Avatar description"
                        class="bg-gray-800 text-white w-full p-2 rounded focus:outline-none" />
                </div>
                <div>
                    <label class="block text-sm text-gray-300" for="bannerUrl">Banner URL</label>
                    <input id="bannerUrl" name="bannerUrl" type="url" placeholder="https://…"
                        class="bg-gray-800 text-white w-full p-2 rounded focus:outline-none" />
                </div>
                <div>
                    <label class="block text-sm text-gray-300" for="bannerAlt">Banner description</label>
                    <input id="bannerAlt" name="bannerAlt" type="text" placeholder="Banner description"
                        class="bg-gray-800 text-white w-full p-2 rounded focus:outline-none" />
                </div>
                <button type="submit" class="bg-yellow-400 px-4 py-2 rounded hover:bg-yellow-500">Update media</button>
            </form>
        </section>

        <p data-profile-feedback class="text-sm text-yellow-300 min-h-[1.25rem]" aria-live="polite"></p>

        <section class="bg-gray-900 p-4 rounded shadow">
            <h3 class="text-xl font-bold text-gray-100 text-center">Posts</h3>
        </section>
        <section data-profile-posts class="space-y-4"></section>
    </main>
    <script type="module" src="../js/script.js"></script>
</body>

</html>
