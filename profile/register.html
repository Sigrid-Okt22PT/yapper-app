<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Yapper</title>
    <meta name="description" content="Register a new Yapper account." />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-800" data-page="register">
    <main class="w-full flex flex-col items-center gap-6">
        <form id="registerForm" data-auth-form="register"
            class="bg-gray-900 p-8 rounded-lg shadow-md w-full max-w-md space-y-4">
            <h1 class="text-3xl font-bold text-center text-yellow-400">Yapper</h1>
            <p class="text-center text-gray-300">Use your Noroff email address to register.</p>
            <p class="text-sm text-center min-h-[1.25rem]" data-register-feedback aria-live="polite"></p>
            <label class="block">
                <span class="sr-only">Display name</span>
                <input type="text" name="name" required placeholder="Display name"
                    class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
            </label>
            <label class="block">
                <span class="sr-only">Email</span>
                <input type="email" name="email" required placeholder="Email" autocomplete="email"
                    class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
            </label>
            <label class="block">
                <span class="sr-only">Password</span>
                <input type="password" name="password" required minlength="8" placeholder="Password"
                    autocomplete="new-password"
                    class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
            </label>
            <label class="block">
                <span class="sr-only">Avatar Image</span>
                <input type="file" name="avatarFile" accept="image/*"
                    class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
            </label>
            <label class="block">
                <span class="sr-only">Avatar description</span>
                <input type="text" name="avatarAlt" placeholder="Avatar description (optional)"
                    class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
            </label>
            <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 font-semibold p-2 rounded">Register</button>
            <p class="text-sm text-center text-gray-300">
                Already have an account?
                <a href="../index.html" class="text-yellow-400 hover:text-yellow-500 font-semibold">Login</a>
            </p>
        </form>
    </main>
    <script type="module" src="../js/script.js"></script>
</body>
</html>
