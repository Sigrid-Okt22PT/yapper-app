<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Post | Yapper</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gray-800 min-h-screen" data-page="post">
  <main class="p-4 mt-4 max-w-2xl mx-auto space-y-6">
    <section id="post" class="bg-gray-900 p-4 rounded shadow"></section>
    <p id="postFeedback" class="text-sm text-yellow-300 min-h-[1.25rem]" aria-live="polite"></p>
  </main>

 <script type="module">
  import { requireAuth, readJWT } from '../js/script.js';
  import { getPost, updatePost, deletePost, reactToPost, createComment } from '../js/posts.js';

  if (!requireAuth("../index.html")) throw new Error("unauthenticated");

  const id = new URLSearchParams(location.search).get("id");
  const me = readJWT();
  // ...load + render like before

  async function onEdit(e) {
    e.preventDefault();
    // build payload...
    await updatePost(id, payload);
    // reload...
  }

  async function onDelete() {
    if (!confirm("Delete this post?")) return;
    await deletePost(id);
    location.href = "../feed/";
  }

  // Optional: reactions
  document.querySelectorAll("[data-react]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const symbol = btn.dataset.react;
      await reactToPost(id, symbol);
      // reload counts or optimistic update
    });
  });

  // Optional: comments
  document.getElementById("commentForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = new FormData(e.currentTarget).get("comment");
    if (!String(text).trim()) return;
    await createComment(id, String(text));
    // reload comments...
  });
</script>

</body>
</html>
