<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed | Yapper</title>
  <meta name="description" content="Yapper - A playful social media frontend built with Tailwind CSS. Create posts, like posts, view user profiles, and enjoy a minimal responsive design." />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gray-800 min-h-screen" data-page="feed">
  <!-- Header -->
  <header class="bg-gray-900 shadow-md px-4 py-3 flex items-center justify-between md:px-8">
    <a href="../" class="text-xl font-bold text-yellow-400">Yapper</a>

    <!-- Desktop search (now matches file 1 with a button) -->
    <form data-search-form class="hidden md:flex items-center ml-6">
      <input
        id="desktop-search"
        name="search"
        type="search"
        placeholder="Search posts..."
        class="p-2 rounded-l focus:outline-none bg-gray-800 text-white"
      />
      <button type="submit" class="bg-yellow-400 px-4 py-2 rounded-r hover:bg-yellow-700">
        Search
      </button>
    </form>

    <!-- Desktop nav styled like file 1 -->
    <nav class="hidden md:flex space-x-6 text-sm items-center">
      <a href="./" class="text-yellow-300 hover:text-yellow-600 font-medium">Feed</a>
      <a href="./create-post.html" class="text-yellow-300 hover:text-yellow-600 font-medium">New Post</a>
      <a href="../profile/" class="text-yellow-300 hover:text-yellow-600 font-medium">Profile</a>
      <a href="#" data-logout class="text-yellow-300 hover:text-red-500 font-medium">Logout</a>
    </nav>

    <!-- Mobile menu -->
    <details class="md:hidden relative">
      <summary class="cursor-pointer p-2 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400 list-none">
        <svg class="w-6 h-6 text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </summary>
      <div class="absolute right-0 mt-2 w-44 bg-gray-900 border border-gray-800 rounded shadow-md py-2 z-10">
        <a href="./" class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm">Feed</a>
        <a href="./create-post.html" class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm">New Post</a>
        <a href="../profile/" class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm">Profile</a>
        <a href="#" data-logout class="block text-yellow-300 px-4 py-2 hover:bg-gray-800 text-sm hover:text-red-400">Logout</a>
      </div>
    </details>
  </header>

  <main class="p-4 mt-4 max-w-2xl mx-auto space-y-6">
    <!-- Mobile search (like file 1) -->
    <section class="flex md:hidden p-4">
      <form data-search-form class="flex items-center w-full">
        <input
          id="mobile-search"
          name="search"
          type="search"
          placeholder="Search posts..."
          class="p-2 rounded-l focus:outline-none bg-gray-700 text-white flex-1"
        />
        <button type="submit" class="bg-yellow-400 px-4 py-2 rounded-r hover:bg-yellow-700">
          Search
        </button>
      </form>
    </section>


    <!-- Sort / page size controls with matching styling -->
    <div class="flex items-center justify-between gap-3 text-sm">
      <div class="flex items-center gap-2">
        <label for="limit" class="text-yellow-300">Page size</label>
        <select id="limit" data-limit class="bg-gray-900 border border-gray-700 text-yellow-300 rounded px-2 py-1">
          <option value="12">12</option>
          <option value="24" selected>24</option>
          <option value="48">48</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <label for="sort" class="text-yellow-300">Sort by</label>
        <select
          id="sort"
          name="sort"
          data-sort
          class="bg-gray-900 border border-gray-700 text-yellow-300 rounded px-2 py-1"
        >
          <option value="latest" selected>Latest</option>
          <option value="popular">Popular</option>
        </select>
      </div>

    </div>

    <!-- Posts grid (unchanged functionality, just spacing aligns with file 1) -->
    <section
      data-posts
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    </section>

    <!-- Pagination + feedback -->
    <nav data-pagination class="flex items-center justify-between gap-2"></nav>
    <p class="text-sm text-yellow-300 min-h-[1.25rem]" data-feed-feedback aria-live="polite"></p>
  </main>

  <!-- Keep your module entry; functionality stays intact -->
  <script type="module" src="../js/script.js"></script>
</body>
</html>
