<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Post | Yapper</title>
  <meta name="description" content="Create a new post on Yapper." />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gray-800 min-h-screen" data-page="create-post">
  <header class="bg-gray-900 shadow-md px-4 py-3 flex items-center justify-between md:px-8">
    <a href="../feed/index.html" class="text-xl font-bold text-yellow-400">Yapper</a>
    <nav class="hidden md:flex space-x-6 text-sm items-center">
      <a href="../feed/" class="text-yellow-300 hover:text-gray-300 font-medium">Feed</a>
      <a href="../profile/" class="text-yellow-300 hover:text-gray-300 font-medium">Profile</a>
      <a href="#" data-logout class="text-yellow-300 hover:text-red-500 font-medium">Logout</a>
    </nav>
  </header>

  <main class="p-4 mt-4 max-w-2xl mx-auto space-y-6">
    <form id="createPostForm" class="bg-gray-900 p-4 rounded shadow space-y-3">
      <label class="block">
        <span class="sr-only">Title</span>
        <input type="text" name="title" required placeholder="Title"
          class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
      </label>
      <label class="block">
        <span class="sr-only">Body</span>
        <textarea name="body" required placeholder="What's on your mind?" rows="3"
          class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white"></textarea>
      </label>
      <label class="block">
        <span class="sr-only">Tags</span>
        <input type="text" name="tags" placeholder="Tags (comma separated)"
          class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
      </label>
      <label class="block">
        <span class="sr-only">Image URL</span>
        <input type="url" name="mediaUrl" placeholder="Image URL (optional)"
          class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
      </label>
      <label class="block">
        <span class="sr-only">Image description</span>
        <input type="text" name="mediaAlt" placeholder="Image description (optional)"
          class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
      </label>
      <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 font-semibold p-2 rounded">Post</button>
    </form>
    <p class="text-sm text-yellow-300 min-h-[1.25rem]" id="postFeedback" aria-live="polite"></p>
  </main>

  <script type="module">
  import { requireAuth, logout } from '../js/script.js';
  import { createPost } from '../js/posts.js';

  if (!requireAuth("../index.html")) throw new Error("unauthenticated");
  document.querySelector('[data-logout]')?.addEventListener('click', (e)=>{ e.preventDefault(); logout(); });

  const form = document.getElementById('createPostForm');
  const feedback = document.getElementById('postFeedback');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    feedback.textContent = '';

    const fd = new FormData(form);
    const title = String(fd.get('title')||'').trim();
    const body  = String(fd.get('body')||'').trim();
    const tags  = String(fd.get('tags')||'').split(',').map(t => t.trim()).filter(Boolean);
    const mediaUrl = String(fd.get('mediaUrl')||'').trim();
    const mediaAlt = String(fd.get('mediaAlt')||'').trim();

    const payload = { title, body, tags };
    if (mediaUrl) payload.media = { url: mediaUrl, alt: mediaAlt || title };

    try {
      feedback.textContent = 'Posting…';
      const { data } = await createPost(payload);
      feedback.textContent = 'Post created!';
      setTimeout(() => location.href = `./post.html?id=${encodeURIComponent(data?.id)}`, 600);
    } catch (e) {
      feedback.textContent = e.message || 'Failed to create post.';
    }
  });

  </script>
</body>
</html>
