<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yapper · Login</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-800" data-page="login">
  <form id="loginForm" class="bg-gray-900 p-8 rounded-lg shadow-md w-full max-w-md space-y-4 mx-auto">
    <h2 class="text-2xl font-bold text-center text-yellow-400">Login</h2>
    <p id="loginFb" class="text-sm text-center text-yellow-300 min-h-[1.25rem]" aria-live="polite"></p>

    <label class="block">
      <span class="sr-only">Email</span>
      <input type="email" name="email" required placeholder="Email" autocomplete="email"
        class="w-full border p-2 rounded focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
    </label>

    <label class="block relative">
      <span class="sr-only">Password</span>
      <input id="loginPwd" type="password" name="password" required minlength="8" placeholder="Password" autocomplete="current-password"
        class="w-full border p-2 rounded pr-10 focus:outline-none focus:ring focus:border-yellow-400 bg-gray-800 text-white" />
      <button id="toggleLoginPwd" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-gray-300 hover:text-gray-100">Show</button>
    </label>

    <button id="loginBtn" class="w-full bg-yellow-400 hover:bg-yellow-500 font-semibold p-2 rounded">Login</button>

    <p class="text-sm text-center text-gray-300">
      New here?
      <a href="./profile/register.html" class="text-yellow-400 hover:text-yellow-500 font-semibold">Register</a>
    </p>
  </form>

  <script type="module">
    import { login } from './js/script.js';

    // If already logged in, bounce to feed
    if (localStorage.getItem('yapper_token')) {
      location.href = './feed/';
    }

    const form = document.getElementById('loginForm');
    const fb = document.getElementById('loginFb');
    const btn = document.getElementById('loginBtn');
    const pwd = document.getElementById('loginPwd');
    const toggle = document.getElementById('toggleLoginPwd');

    toggle.addEventListener('click', () => {
      const isPw = pwd.type === 'password';
      pwd.type = isPw ? 'text' : 'password';
      toggle.textContent = isPw ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      fb.textContent = "";
      btn.disabled = true;
      btn.textContent = "Logging in…";

      const fd = new FormData(form);
      const email = String(fd.get('email')||'').trim();
      const password = String(fd.get('password')||'');

      try {
        await login({ email, password });
        location.href = "./feed/";
      } catch (err) {
        fb.textContent = err.message || "Login failed.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
